{% block content %}
<div class="modal fade" id="priorityInterfacesModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg" role="document">
      <div class="modal-content">
  
        <div class="modal-header">
          <h5 class="modal-title">Tracked Interfaces – {{ inventory.name }}</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
  
        <form 
          hx-post="{% url 'inventory_priority_interfaces' inventory.pk %}" 
          hx-target="#priorityInterfacesModal .modal-content" 
          hx-swap="innerHTML"
        >
          <div class="modal-body">
            <!-- Tabs -->
            <ul class="nav nav-tabs">
              <li class="nav-item">
                <a class="nav-link active" data-bs-toggle="tab" href="#generator">Generator</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" data-bs-toggle="tab" href="#manual">Manual</a>
              </li>
            </ul>
  
            <div class="tab-content mt-3">
              <!-- Generator tab -->
              <div class="tab-pane fade show active" id="generator">
                <div class="row g-2">
                  <div class="col">
                    <label class="form-label">Prefix</label>
                    <select id="iface-prefix" class="form-control">
                      <option value="Ethernet">Ethernet</option>
                      <option value="Eth">Eth</option>
                      <option value="Gi">Gi</option>
                      <option value="Te">TenGig</option>
                    </select>
                  </div>
                  <div class="col">
                    <label class="form-label">Slot</label>
                    <input type="number" id="slot" class="form-control" value="1" min="0">
                  </div>
                  <div class="col">
                    <label class="form-label">Ports</label>
                    <input type="number" id="ports" class="form-control" value="48" min="1">
                  </div>
                  <div class="col d-flex align-items-end">
                    <button type="button" id="gen-btn" class="btn btn-secondary">Generate</button>
                  </div>
                </div>
                <div id="iface-list" class="mt-3"></div>
              </div>
  
              <!-- Manual tab -->
              <div class="tab-pane fade" id="manual">
                <label class="form-label">Custom Interfaces</label>
                <textarea id="iface-custom" class="form-control" rows="4"
                  placeholder="Enter interfaces, comma or newline separated (e.g. mgmt0, Po2000, Vlan10)"></textarea>
                <button type="button" id="manual-btn" class="btn btn-secondary mt-2">Add</button>
                <div id="manual-list" class="mt-3"></div>
              </div>
            </div>
  
            <!-- Already saved -->
            <h6 class="mt-4">Currently saved as priority:</h6>
            <ul>
              {% for iface in interfaces %}
                {% if iface.is_priority %}
                  <li>{{ iface.name }}</li>
                {% endif %}
              {% empty %}
                <li>No priority interfaces set.</li>
              {% endfor %}
            </ul>
          </div>
  
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary">Save</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const ifaceList = document.getElementById("iface-list");
      const manualList = document.getElementById("manual-list");
    
      const genBtn = document.getElementById("gen-btn");
      if (genBtn) {
        genBtn.addEventListener("click", function() {
          const prefix = document.getElementById("iface-prefix").value;
          const slot = document.getElementById("slot").value;
          const ports = parseInt(document.getElementById("ports").value, 10);
    
          let html = "<div class='row'>";
          for (let i = 1; i <= ports; i++) {
            const name = `${prefix}${slot}/${i}`;
            html += `<div class="col-3">
                       <input type="checkbox" name="priority_interfaces" value="${name}" id="${name}">
                       <label for="${name}">${name}</label>
                     </div>`;
          }
          html += "</div>";
          ifaceList.innerHTML = html;
        });
      }
    
      const manualBtn = document.getElementById("manual-btn");
      if (manualBtn) {
        manualBtn.addEventListener("click", function() {
          const raw = document.getElementById("iface-custom").value;
          const names = raw.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
    
          let html = "<div class='row'>";
          names.forEach(name => {
            html += `<div class="col-3">
                       <input type="checkbox" name="priority_interfaces" value="${name}" id="${name}">
                       <label for="${name}">${name}</label>
                     </div>`;
          });
          html += "</div>";
          manualList.innerHTML = html;
        });
      }
    });
    </script>
{% endblock %}
